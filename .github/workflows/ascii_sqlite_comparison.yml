name: Ascii vs Sqlite
permissions:
  contents: read
  pull-requests: write

on:
  schedule:
    # every day at 2:44
    # Only compare detectors affected by commits in the last 24 hours.
    - cron: '44 2 * * *'

  # Manual runs always compare every detector.
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      geometry: ${{ steps.matrix.outputs.geometry }}
      run: ${{ steps.matrix.outputs.run }}
      has_geometry: ${{ steps.matrix.outputs.has_geometry }}
      has_run: ${{ steps.matrix.outputs.has_run }}
    steps:
      - name: Checkout history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select detector matrices
        id: matrix
        run: python3 ci/ascii_sqlite_matrix.py

  Notary:
    needs: changes
    if: needs.changes.outputs.has_geometry == 'true'
    runs-on: ubuntu-latest
    container: jeffersonlab/gemc:dev-almalinux94
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Notary
        run: |
          ./ci/report_runs_and_variations.sh  > Summary.md
          cat Summary.md >> $GITHUB_STEP_SUMMARY

  txt-sql-geo:
    needs: [changes, Notary]
    if: needs.changes.outputs.has_geometry == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/gemc/clas12tags:dev-almalinux-10
    strategy:
      fail-fast: false
      matrix:
        detector: ${{ fromJSON(needs.changes.outputs.geometry) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6


      - name: Fix Java Version
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Install Git LFS
        run: |
          dnf -y install git-lfs

      - name: Build Coatjava
        run: |
          cd ./geometry_source
          git lfs install
          ./install_coatjava.sh -l
          
      - name: Set up GEMC environment
        uses: ./.github/actions/setup-gemc
      - name: Build GEMC with Meson
        run: ./ci/build.sh --create-geometry --skip-tests
      - name: Geometry ${{ matrix.detector }} Comparison
        run: |
          ./ci/txt_sql_geometry_comparison.sh -d ${{ matrix.detector }}
      - name: Upload logs
        uses: actions/upload-artifact@v7
        with:
          name: geologs-${{ matrix.detector }}
          path: /root/logs/

  txt-sql-run:
    needs: [changes, Notary]
    if: needs.changes.outputs.has_run == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/gemc/clas12tags:dev-almalinux-10
    strategy:
      fail-fast: false
      matrix:
        detector: ${{ fromJSON(needs.changes.outputs.run) }}

        # Digitization variations from the clas12-config dev gcards.
        variation:
          - default
          - rga_spring2018_mc
          - rga_fall2018_mc
          - rga_spring2019_mc
          - rgb_fall2019_mc
          - rgb_spring2019_mc
          - rgc_summer2022_mc
          - rgf_spring2020_mc
          - rgm_fall2021_mc

    steps:
      - name: Checkout
        uses: actions/checkout@v6


      - name: Fix Java Version
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Install Git LFS
        run: |
          dnf -y install git-lfs

      - name: Build Coatjava
        run: |
          cd ./geometry_source
          git lfs install
          ./install_coatjava.sh -l

      - name: Set up GEMC environment
        uses: ./.github/actions/setup-gemc
      - name: Build GEMC with Meson
        run: ./ci/build.sh --create-geometry --skip-tests

      - name: Install Software
        run: |
          ./ci/install_comparison_software.sh

      - name: GEMC ${{ matrix.detector }} Comparison
        run: |
          ./ci/txt_sql_run_comparison.sh -d ${{ matrix.detector }} -v ${{ matrix.variation }}

      - name: Upload logs
        uses: actions/upload-artifact@v7
        with:
          name: gemclogs-${{ matrix.detector }}-${{ matrix.variation }}
          path: /root/logs/

  txt-sql-geo-result:
    needs: txt-sql-geo
    runs-on: ubuntu-latest
    steps:
      - name: Collect logs
        uses: actions/download-artifact@v4
        with:
          pattern: geologs-*
      - name: Generate Table
        run: |
          ls */*geo_comparison.log
          cat */*geo_comparison.log > comparison.log
          echo "| Detector | Geometry Variation | Run | Status  |" > Summary.md
          echo "|----------|--------------------|-----|---------|" >> Summary.md
          while IFS=: read -r detector variation run pass; do
            echo "| $detector | $variation | $run | $pass |" >> Summary.md
          done < comparison.log
          cat Summary.md >> $GITHUB_STEP_SUMMARY
          if grep -q '❌' comparison.log; then exit 1; fi

  txt-sql-run-result:
    needs: txt-sql-run
    runs-on: ubuntu-latest
    steps:
      - name: Collect logs
        uses: actions/download-artifact@v4
        with:
          pattern: gemclogs-*
      - name: Detailed Table
        run: |
          ls */*output_details.log
          cat */*output_details.log > comparison.log
          echo "| Detector | Geometry Variation | Run | Bank | Digitization Variations | Status  |" > Summary.md
          echo "|----------|--------------------|-----|------|-------------------------|---------|" \
            >> Summary.md
          while IFS=: read -r detector variation run bank dvariations  pass; do
            echo "| $detector | $variation | $run | $bank | $dvariations | $pass |" >> Summary.md
          done < comparison.log
          cat Summary.md >> $GITHUB_STEP_SUMMARY
      - name: Summary Digitization Table
        run: |
          ls -Rl
          ls */*output_summary.log
          cat */*output_summary.log > comparison.log
          echo "| Detector | Digitization Variations | Status  |" > Summary.md
          echo "|----------|-------------------------|---------|" >> Summary.md
          while IFS=: read -r detector dvariations  pass; do
            echo "| $detector | $dvariations | $pass |" >> Summary.md
          done < comparison.log
          cat Summary.md >> $GITHUB_STEP_SUMMARY
      - name: Summary Detector Table
        run: |
          ls */*output_summary.log
          detectors=$( cat */*_output_summary.log | awk -F: '{print $1}' | sort -u)
          echo "| Detector | Status  |" > Summary.md
          echo "|----------|---------|" >> Summary.md
          for detector in $detectors; do
            if grep "❌" */*output_summary.log | grep -q $detector ; then
                echo "| $detector | ❌ |" >> Summary.md
            elif grep "✅" */*output_summary.log | grep -q $detector; then
                echo "| $detector | ✅ |" >> Summary.md
            fi
          done
          cat Summary.md >> $GITHUB_STEP_SUMMARY
          if grep -q '❌' */*output_summary.log; then exit 1; fi
  

  txt-sql-final:
    if: always()
    needs:
      - changes
      - Notary
      - txt-sql-geo
      - txt-sql-run
      - txt-sql-geo-result
      - txt-sql-run-result
    runs-on: ubuntu-latest
    steps:
      - name: fail
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "### Some tests failed." >> $GITHUB_STEP_SUMMARY
          exit 1
      - name: pass
        run: |
          echo "### All selected tests passed (unchanged detectors skipped)." >> $GITHUB_STEP_SUMMARY
          exit 0
