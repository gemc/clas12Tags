name: Valgrind-Profile
permissions:
  contents: read
  pull-requests: write

on:
  schedule:
    # every day at 1:10
    # clasdis takes 3 hours 10 minutes
    - cron: '10 1 * * *'


  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  workflow_run:
    workflows: [ "Test" ]
    types: [ completed ]
    branches: [ meson ]

  # Allows this workflow to be called by other workflows
  # Thus the checkout with repository: ${{ 'gemc/clas12Tags' }} is added
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"

jobs:
  detect-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Set effective branch
        id: vars
        run: |
          echo "BRANCH_NAME=${{ inputs.branch || github.ref_name }}" >> $GITHUB_OUTPUT


  profile-metrics:
    runs-on: ubuntu-latest
    container: jeffersonlab/gemc:dev-almalinux94
    strategy:
      fail-fast: false
      matrix:
        ntracks:
          - '03'
          - '05'
          - 'clasdis_all'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ 'gemc/clas12Tags' }}

      - name: Fix Java Version
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Install Git LFS
        run: |
          dnf -y install git-lfs 

      - name: Build Coatjava
        run: |
          cd ./geometry_source
          git lfs install
          ./install_coatjava.sh -l

      - name: Build Gemc
        run: |
          ./ci/build_gemc.sh DEBUG

      - name: Install Valgrind
        run: yum install -y valgrind

      - name: Prepare events for ${{ matrix.ntracks }}
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          [[ -d clas12-config ]] || git clone -b dev https://github.com/JeffersonLab/clas12-config
          gcard="clas12-config/gemc/dev/rga_spring2019.gcard"
          if [[ "${{ matrix.ntracks }}" == "clasdis_all" ]]; then
            nevents=20
            cp ci/generated_events/clasdis_all.dat events.dat
          else
            nevents=60
            ./ci/generated_events/randomize_particles.py --nevents "$nevents" -o events.dat \
              --theta-min 7 --theta-max 120 --seed 123 "ci/generated_events/${{ matrix.ntracks }}_tracks.dat"
          fi
          echo "gcard=$gcard" >> "$GITHUB_OUTPUT"
          echo "nevents=$nevents" >> "$GITHUB_OUTPUT"
          # Set up the GEMC2 module environment once here (ci/env.sh is zsh) and persist it, so the
          # Callgrinder action runs gemc directly — only gemc is then profiled under valgrind, not the
          # module setup. env -0 handles multiline values; PATH entries go to GITHUB_PATH.
          while IFS='=' read -r -d '' key value; do
            case "$key" in
              PATH) printf '%s\n' "$value" | tr ':' '\n' >> "$GITHUB_PATH" ;;
              PWD|OLDPWD|SHLVL|_|HOME|CI|GITHUB_*|RUNNER_*|INPUT_*) : ;;
              *) printf '%s<<__CGENV__\n%s\n__CGENV__\n' "$key" "$value" >> "$GITHUB_ENV" ;;
            esac
          done < <(zsh -c 'source ci/env.sh >/dev/null 2>&1; env -0')

      - name: Profile ${{ matrix.ntracks }}
        uses: gemc/Callgrinder@v1
        with:
          mode: profile
          name: ${{ matrix.ntracks }}
          command: "gemc -INPUT_GEN_FILE=\"lund, events.dat\" -USE_GUI=0 -N={events} -PRINT_EVENT=10 -GEN_VERBOSITY=10 -RANDOMIZE_LUND_VZ='-1.94*cm, 2.5*cm, reset ' -BEAM_SPOT='0.0*mm, 0.0*mm, 0.0*mm, 0.0*mm, 0*deg, reset ' -RASTER_VERTEX='0.0*cm, 0.0*cm, reset ' -SCALE_FIELD='binary_torus, -1.00' -SCALE_FIELD='binary_solenoid, -1.00' -INTEGRATEDRAW='*' ${{ steps.prep.outputs.gcard }}"
          events: ${{ steps.prep.outputs.nevents }}
          config: ci/callgrinder.json
          output-dir: callgrinder-parts

      - name: Upload profile
        uses: actions/upload-artifact@v7
        with:
          name: callgrinder-${{ matrix.ntracks }}
          path: callgrinder-parts
          if-no-files-found: error
          retention-days: 30

  guidance:
    name: How to read the profiles
    needs: profile-metrics
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download profiles
        uses: actions/download-artifact@v5
        with:
          pattern: callgrinder-*
          path: profiles

      - name: Aggregate the category tables and qcachegrind guidance
        uses: gemc/Callgrinder@v1
        with:
          mode: report
          input-dir: profiles

  profile-metrics-final:
    needs:
      - profile-metrics
      - guidance
    runs-on: ubuntu-latest
    steps:
      - name: fail
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "### Some tests failed." >> $GITHUB_STEP_SUMMARY
          exit 1
      - name: pass
        run: |
          echo "### All tests passed." >> $GITHUB_STEP_SUMMARY
          exit 0
