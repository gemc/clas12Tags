name: Valgrind-Profile
permissions:
  contents: read
  pull-requests: write

on:
  schedule:
    # every day at 1:10
    # clasdis takes 3 hours 10 minutes
    - cron: '10 1 * * *'


  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Allows this workflow to be called by other workflows
  # Thus the checkout with repository: ${{ 'gemc/clas12Tags' }} is added
  workflow_call:
    inputs:
      branch:
        required: false
        type: string

jobs:
  profile-metrics:
    runs-on: ubuntu-latest
    container: ghcr.io/gemc/clas12tags:dev-almalinux-10
    strategy:
      fail-fast: false
      matrix:
        ntracks:
          - '03'
          - '05'
          - 'clasdis_all'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ 'gemc/clas12Tags' }}
          ref: ${{ inputs.branch || github.sha }}
          fetch-depth: 0

      - name: Fix Java Version
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Install Git LFS
        run: |
          dnf -y install git-lfs

      - name: Build Coatjava
        run: |
          cd ./geometry_source
          git lfs install
          ./install_coatjava.sh -l

      - name: Set up GEMC environment
        uses: ./.github/actions/setup-gemc

      - name: Build GEMC with Meson
        run: ./ci/build.sh --buildtype debug --create-geometry --skip-tests

      - name: Install Valgrind
        run: yum install -y valgrind

      - name: Prepare events for ${{ matrix.ntracks }}
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          [[ -d clas12-config ]] || git clone -b dev https://github.com/JeffersonLab/clas12-config
          gcard="clas12-config/gemc/dev/rga_spring2019.gcard"
          if [[ "${{ matrix.ntracks }}" == "clasdis_all" ]]; then
            nevents=100
            cp ci/generated_events/clasdis_all.dat events.dat
          else
            nevents=200
            ./ci/generated_events/randomize_particles.py --nevents "$nevents" -o events.dat \
              --theta-min 7 --theta-max 120 --seed 123 "ci/generated_events/${{ matrix.ntracks }}_tracks.dat"
          fi
          echo "gcard=$gcard" >> "$GITHUB_OUTPUT"
          echo "nevents=$nevents" >> "$GITHUB_OUTPUT"

      - name: Profile ${{ matrix.ntracks }}
        uses: gemc/Callgrinder@v1
        with:
          mode: profile
          name: ${{ matrix.ntracks }}
          command: >-
            "${{ github.workspace }}/install/bin/gemc"
            -INPUT_GEN_FILE="lund, events.dat" -USE_GUI=0 -N={events} -PRINT_EVENT=10 -GEN_VERBOSITY=10
            -RANDOMIZE_LUND_VZ='-1.94*cm, 2.5*cm, reset '
            -BEAM_SPOT='0.0*mm, 0.0*mm, 0.0*mm, 0.0*mm, 0*deg, reset '
            -RASTER_VERTEX='0.0*cm, 0.0*cm, reset '
            -SCALE_FIELD='binary_torus, -1.00' -SCALE_FIELD='binary_solenoid, -1.00'
            -INTEGRATEDRAW='*' ${{ steps.prep.outputs.gcard }}
          events: ${{ steps.prep.outputs.nevents }}
          config: ci/callgrinder.json
          output-dir: callgrinder-parts

      - name: Upload profile
        uses: actions/upload-artifact@v7
        with:
          name: callgrinder-${{ matrix.ntracks }}
          path: callgrinder-parts
          if-no-files-found: error
          retention-days: 7

  guidance:
    name: How to read the profiles
    needs: profile-metrics
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download profiles
        uses: actions/download-artifact@v5
        with:
          pattern: callgrinder-*
          path: profiles

      - name: Aggregate the category tables and qcachegrind guidance
        uses: gemc/Callgrinder@v1
        with:
          mode: report
          input-dir: profiles

  profile-metrics-final:
    needs:
      - profile-metrics
      - guidance
    runs-on: ubuntu-latest
    steps:
      - name: fail
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "### Some tests failed." >> $GITHUB_STEP_SUMMARY
          exit 1
      - name: pass
        run: |
          echo "### All tests passed." >> $GITHUB_STEP_SUMMARY
          exit 0
