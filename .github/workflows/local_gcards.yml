name: Local Gcards Tests
permissions:
  contents: read
  pull-requests: write

  # Triggers the workflow on all pushes to main, all pull and merge requests
on:
  pull_request:
  merge_group:
  push:
    branches: [ main ]
    tags: [ '*' ]
    paths-ignore:
      - "**/*.md"
      - "release_notes/**"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:

  local-gcards-test:
    name: (${{ matrix.detector }})
    runs-on: ubuntu-latest
    container: ghcr.io/gemc/clas12tags:dev-almalinux-10
    strategy:
      fail-fast: false
      matrix:
        detector:
          - ec
          - pcal
          - dc
          - ftof
          - ctof
          - cnd
          - bst
          - htcc
          - micromegas
          - ltcc
          - rich
          - ft
          - beamline
          - magnets
          - targets

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fix Java Version
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Install Git LFS
        run: |
          dnf -y install git-lfs 
      - name: Build Coatjava
        run: |
          cd ./geometry_source
          git lfs install
          ./install_coatjava.sh -l
      - name: Set up GEMC environment
        uses: ./.github/actions/setup-gemc
      - name: Build GEMC with Meson
        run: ./ci/build.sh --create-geometry --skip-tests
      - name: Gcard ${{ matrix.detector }} Test
        run: |
          ./ci/local_gcards_test.sh -d ${{ matrix.detector }}
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: buildlogs-${{ matrix.detector }}
          path: |
            logs/
            geometry_source/build_coatjava.log

  local-gcards-test-final:
    name: Local Gcards Test
    needs:
      - local-gcards-test
    runs-on: ubuntu-latest
    steps:
      - name: fail
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "### Some tests failed." >> $GITHUB_STEP_SUMMARY
          exit 1
      - name: pass
        run: |
          echo "### All tests passed." >> $GITHUB_STEP_SUMMARY
          exit 0
