name: Fedora Build
permissions:
  contents: read
  pull-requests: write

 # Triggers the workflow on all pushes to main and all pull requests
on:
  pull_request:
  merge_group:
  push:
    branches: [ main ]
    tags: [ '*' ]
    paths-ignore:
      - "**/*.md"
      - "release_notes/**"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-coatjava:
    uses: ./.github/workflows/coatjava_build.yml
    with:
      artifact-name: coatjava-build-gemc-fedora
      container-image: jeffersonlab/gemc:dev-fedora36

  build-on-fedora:
    needs: build-coatjava
    runs-on: ubuntu-latest
    container: jeffersonlab/gemc:dev-fedora36
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fix Java Version
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Download Coatjava build
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-coatjava.outputs.artifact-name }}
      - name: Extract Coatjava build
        run: tar -xzf coatjava.tar.gz -C geometry_source
      - name: Build Gemc
        run: |
          ./ci/build_gemc.sh
          echo "github.event.head_commit.committer.name: ${{ github.event.head_commit.committer.name }}"
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gemc-fedora
          path: |
            /cvmfs/oasis.opensciencegrid.org/jlab/geant4/mlibrary
            /cvmfs/oasis.opensciencegrid.org/jlab/geant4/bin
            /cvmfs/oasis.opensciencegrid.org/jlab/geant4/api
            /cvmfs/oasis.opensciencegrid.org/jlab/geant4/clas12.sqlite
            /cvmfs/oasis.opensciencegrid.org/jlab/geant4/experiments
            /cvmfs/oasis.opensciencegrid.org/jlab/geant4/gemc_build.log
            /cvmfs/oasis.opensciencegrid.org/jlab/geant4/geo_build.log
            /cvmfs/oasis.opensciencegrid.org/jlab/geant4/build_coatjava.log
