name: Prepare Coatjava

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
      container-image:
        description: GEMC image in which to compile Coatjava
        required: true
        type: string
    outputs:
      artifact-name:
        description: Coatjava runtime, JARs, validation scripts, and build log
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MAVEN_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository
  MAVEN_SKIP_RC: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    container: ${{ inputs.container-image }}
    outputs:
      artifact-name: ${{ inputs.artifact-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Git LFS
        run: |
          if command -v git-lfs >/dev/null 2>&1; then
            git lfs version
            exit 0
          fi
          source /etc/os-release
          case "$ID" in
            almalinux) dnf -y --disablerepo=almalinux-synergy install git-lfs ;;
            fedora) dnf -y install git-lfs ;;
            ubuntu|debian)
              apt-get update
              apt-get install -y git-lfs
              ;;
            *) echo "Unsupported Coatjava build OS: $ID" >&2; exit 1 ;;
          esac
      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          # Use upstream's Java 21 selector; report the resolved JVM below.
          java-version: '21'
          distribution: 'zulu'
          force-download: true
          show-download-progress: true
      - name: Report original Maven trust
        run: bash ci/report_maven_trust.sh | tee geometry_source/maven_trust_before.log
      - name: Configure Java trust and Maven
        run: |
          bash ci/configure_java_trust.sh 2>&1 | tee geometry_source/build_coatjava.log
          truststore="$JAVA_HOME/lib/security/cacerts"
          echo "MAVEN_OPTS=$MAVEN_OPTS -Djavax.net.ssl.trustStore=$truststore" >> "$GITHUB_ENV"
          echo "COATJAVA_MAVEN_EXECUTABLE=$(command -v mvn)" >> "$GITHUB_ENV"
          wrapper_dir="$RUNNER_TEMP/coatjava-maven"
          mkdir -p "$wrapper_dir"
          install -m 755 ci/coatjava_maven.sh "$wrapper_dir/mvn"
          echo "$wrapper_dir" >> "$GITHUB_PATH"
      - name: Checkout latest Coatjava release
        run: |
          release=$(curl -fLsS --retry 3 https://api.github.com/repos/JeffersonLab/coatjava/releases/latest \
            | jq -er '.tag_name')
          git clone --depth 1 --branch "$release" https://github.com/JeffersonLab/coatjava \
            geometry_source/coatjava_src
          echo "Coatjava release: $release" \
            | tee -a "$GITHUB_STEP_SUMMARY" geometry_source/build_coatjava.log
          git -C geometry_source/coatjava_src rev-parse HEAD \
            | tee -a "$GITHUB_STEP_SUMMARY" geometry_source/build_coatjava.log
          mvn --version | tee -a geometry_source/build_coatjava.log
      - name: Report configured Maven trust
        run: |
          bash ci/report_maven_trust.sh geometry_source/coatjava_src \
            | tee geometry_source/maven_trust_after.log
      - name: Compute Maven cache week
        id: cache-key
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Maven dependencies
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.m2/repository
          key: >-
            coatjava-m2-${{ inputs.container-image }}-java21-${{ steps.cache-key.outputs.week
            }}-${{ hashFiles('geometry_source/coatjava_src/**/pom.xml') }}
          restore-keys: |
            coatjava-m2-${{ inputs.container-image }}-java21-
      - name: Build Coatjava with retries
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 90
          command: |
            set -euo pipefail
            cd geometry_source/coatjava_src
            ./build-coatjava.sh --lfs --batch-mode -T1 2>&1 \
              | tee -a ../build_coatjava.log
      - name: Save Maven dependencies
        if: success() && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.m2/repository
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: Package Coatjava
        run: |
          source_dir=geometry_source/coatjava_src
          bundle=$(mktemp -d)
          cp -a "$source_dir/coatjava" "$bundle/coatjava"
          cp "$source_dir/coatjava/lib/clas/"*.jar "$bundle/"
          cp geometry_source/build_coatjava.log "$bundle/"
          mkdir -p "$bundle/coatjava_src/validation"
          cp -a "$source_dir/validation/advanced-tests" "$bundle/coatjava_src/validation/"
          ln -s ../coatjava "$bundle/coatjava_src/coatjava"
          tar -czf coatjava.tar.gz -C "$bundle" .
      - name: Share Coatjava build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: coatjava.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Upload Coatjava build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-log
          path: |
            geometry_source/build_coatjava.log
            geometry_source/maven_trust_*.log
